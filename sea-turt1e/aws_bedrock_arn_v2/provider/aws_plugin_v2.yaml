provider: aws_bedrock_arn
label:
  en_US: "AWS Bedrock ARN"
description:
  en_US: "AWS Bedrock model provider with ARN and custom inference ID support"
  zh_Hans: "支持ARN和自定义推理ID的AWS Bedrock模型提供商"
icon_small:
  en_US: "icon.svg"
icon_large:
  en_US: "icon.svg"
background: "#E5E7EB"
help:
  title:
    en_US: "Configure AWS Bedrock credentials"
    zh_Hans: "配置 AWS Bedrock 凭证"
  url:
    en_US: "https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles.html"
supported_model_types:
  - llm
configurate_methods:
  - predefined-model
  - customizable-model
model_credential_schema:
  model:
    label:
      en_US: Model Name or ARN
      zh_Hans: 模型名称或ARN
    placeholder:
      en_US: Enter model name (e.g., anthropic.claude-3-5-sonnet-20240620-v1:0) or ARN
      zh_Hans: 输入模型名称（如 anthropic.claude-3-5-sonnet-20240620-v1:0）或ARN
  credential_form_schemas:
    - variable: model_name
      label:
        en_US: Model Name/ID
        zh_Hans: 模型名称/ID
      type: text-input
      required: false
      placeholder:
        en_US: Standard model ID (e.g., anthropic.claude-3-5-sonnet-20240620-v1:0)
        zh_Hans: 标准模型ID（如 anthropic.claude-3-5-sonnet-20240620-v1:0）
    - variable: model_arn
      label:
        en_US: Model ARN (Optional)
        zh_Hans: 模型ARN（可选）
      type: text-input
      required: false
      placeholder:
        en_US: Full ARN for custom inference profile (arn:aws:bedrock:...)
        zh_Hans: 自定义推理配置文件的完整ARN（arn:aws:bedrock:...）
    - variable: inference_profile_id
      label:
        en_US: Inference Profile ID (Optional)
        zh_Hans: 推理配置文件ID（可选）
      type: text-input
      required: false
      placeholder:
        en_US: Custom inference profile ID (e.g., ps*******)
        zh_Hans: 自定义推理配置文件ID（如 ps*******）
provider_credential_schema:
  credential_form_schemas:
    - variable: aws_access_key_id
      label:
        en_US: Access Key ID
        zh_Hans: 访问密钥ID
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your AWS Access Key ID
        zh_Hans: 输入您的AWS访问密钥ID
    - variable: aws_secret_access_key
      label:
        en_US: Secret Access Key
        zh_Hans: 秘密访问密钥
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your AWS Secret Access Key
        zh_Hans: 输入您的AWS秘密访问密钥
    - variable: aws_region
      label:
        en_US: AWS Region
        zh_Hans: AWS区域
      type: select
      required: true
      default: us-east-1
      options:
        - value: us-east-1
          label:
            en_US: US East (N. Virginia)
            zh_Hans: 美国东部（弗吉尼亚北部）
        - value: us-west-2
          label:
            en_US: US West (Oregon)
            zh_Hans: 美国西部（俄勒冈）
        - value: ap-northeast-1
          label:
            en_US: Asia Pacific (Tokyo)
            zh_Hans: 亚太地区（东京）
        - value: ap-southeast-1
          label:
            en_US: Asia Pacific (Singapore)
            zh_Hans: 亚太地区（新加坡）
        - value: eu-west-1
          label:
            en_US: Europe (Ireland)
            zh_Hans: 欧洲（爱尔兰）
models:
  llm:
    predefined:
      - "models/llm/*.yaml"
extra:
  python:
    provider_source: provider/aws_plugin_v2.py
    model_sources:
      - "models/llm/llm.py"
